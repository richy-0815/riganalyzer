# Planungsgebiet von RideAnalyzer/RigAnalyzer (eine Liste fuer den Valhalla-Bau und die App).
# Planungsgebiet und OSM-Regionen; daraus entstehen Routing-Daten und OSM-DBs.
# Geofabrik-Auszuege unter europe/ …
rideanalyzer_plan_regions:
  - germany
  - austria
  - switzerland
  - liechtenstein
  - andorra
  - france/alsace
  - france/franche-comte
  - france/bourgogne
  - france/rhone-alpes
  - france/provence-alpes-cote-d-azur
  - france/languedoc-roussillon
  - spain/cataluna
  - denmark          # Skandinavien (Faehren Hirtshals/Frederikshavn -> Norwegen/Schweden mit drin)
  - norway
  - sweden
# … und wie die Seite es nennt / welche Laender die Ortssuche als „im Gebiet“ zaehlt / wohin sie bevorzugt sucht
rideanalyzer_plan_area: "Deutschland, Österreich, Schweiz, Dänemark, Norwegen, Schweden und der Korridor Richtung Verdon/Provence/Katalonien"
rideanalyzer_plan_countries: "de,at,ch,li,fr,es,ad,it,mc,dk,no,se"
rideanalyzer_plan_viewbox: "-2.0,71.5,31.5,40.5"   # lon1,lat1,lon2,lat2

